
name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Run Python lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript formatting
        run: |
          npx --yes prettier@3.3.3 --write server/frontend/src/components/Register/Register.jsx
          npx --yes prettier@3.3.3 --check server/frontend/src/components/Register/Register.jsx
